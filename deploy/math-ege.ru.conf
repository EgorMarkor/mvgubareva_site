server {
    listen 80;
    listen [::]:80;
    server_name math-ege.ru www.math-ege.ru;

    root /var/www/math-ege.ru;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/math-ege.ru.access.log;
    error_log /var/log/nginx/math-ege.ru.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
